<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Evidence Packet — Apply Shopify product image</title>
  <desc id="desc">TOOLKIT product card for organization.</desc>
  <defs>
    <linearGradient id="leftShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#020617" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feOffset in="blur" dx="0" dy="18" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.22" result="flood"/>
      <feComposite in="flood" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .stage-label { font: 700 32px Inter, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #D4AF37; }
    .title-text { font: 800 92px Inter, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #FFFFFF; }
    .outcome-text { font: 500 50px Inter, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #F1F5F9; }
    .meta-text { font: 500 30px Inter, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #D9D9D9; opacity: 0.86; }
    .badge-text { font: 700 32px Inter, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #FFFFFF; }
  </style>
  <image href="data:image/svg+xml;base64," x="0" y="0" width="1600" height="1600" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="1600" fill="#030814" opacity="0.42"/>
  <rect width="1600" height="1600" fill="url(#leftShadow)"/>
  <g filter="url(#softShadow)">
    <path d="M96 1016h470" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <text x="96" y="166" class="stage-label">CONTROL / TOOLKIT</text>
    <text class="title-text"><tspan x="96" y="650">Workflow Evidence</tspan><tspan x="96" y="752">Packet — Apply</tspan></text>
    <text class="outcome-text"><tspan x="100" y="910">Workflow Evidence Packet —</tspan><tspan x="100" y="972">Apply</tspan></text>
    <text x="100" y="1086" class="meta-text">organization | Digital Download</text>
  </g>
  <g color="#FFFFFF">
    <rect x="1280" y="64" width="256" height="88" rx="24" fill="#FFFFFF" fill-opacity="0.03" stroke="#D4AF37" stroke-width="2"/>
    <svg x="1312" y="89" width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 8h16v10.5A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M4 12h16M10 12v2h4v-2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <text x="1364" y="121" class="badge-text">TOOLKIT</text>
  </g>
</svg>
